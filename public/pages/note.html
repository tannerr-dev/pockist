<style>

    main {
        width:100%;

    }
    local-notes {
        height:100%;
        width:100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #note{
        flex-grow:1;
        width:100%;
        box-sizing: border-box;
        border:none;
        outline: none;
        padding:1rem;
        resize: none;

        background-color: var(--bg-2);
        color: var(--text);
        font-size: 1.1rem;
    }

<main></main>

<template id="local-note">
    <h1>Local Note</h1>
    <textarea id="note"></textarea>
    <label for="data">Choose a profile picture:</label>
    <input type="file" id="data" name="data" accept=".json" />
    <button id="import_data_btn" >Import Data</button>
</template>
