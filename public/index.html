<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pockist</title>

    <link rel="icon" href="./assets/logo_white.svg" />

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta property="og:title" content="Pockist">
    <meta
      property="og:description"
      content="Your simple pocket assistant progressive web app. Save notes locally, offline and install the web app to your home screen. More features coming soon..."
    >
    <meta property="og:image" content="https://pockist.com/assets/preview.png">

    <!-- Twitter / X / Bluesky -->

    <meta name="twitter:url" content="https://pockist.com">
    <meta name="twitter:title" content="Pockist">
    <meta
      name="twitter:description"
      content="Your simple pocket assistant progressive web app. Save notes locally, offline and install the web app to your home screen. More features coming soon..."
    >
    <meta name="twitter:image" content="https://pockist.com/assets/preview.png">
  </head>

      </div>
      <div id="options" class="flex-row">
        <div class="menu-wrapper">
          <button class="menu" popovertarget="drawer">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
          </button>
        </div>
      </div>
      <div id="drawer" popover>
        <div id="optionals" class="flex-row drawer-optionals">
          <div class="slidecontainer">
            <input
              class="slider"
              id="color-slider"
              type="range"
              min="0"
              max="360"
              value="0"
            >
          </div>
          <svg
            id="theme-switch"
            class="theme-switch"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sun-moon"
          >
            <path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"></path>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.9 4.9 1.4 1.4"></path>
            <path d="m17.7 17.7 1.4 1.4"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.3 17.7-1.4 1.4"></path>
            <path d="m19.1 4.9-1.4 1.4"></path>
          </svg>
        </div>
        <a href="/" class="drawer-btn" data-nav-link>Home</a>
        <a href="/note" class="drawer-btn" data-nav-link>Notes</a>
        <a href="/weather" class="drawer-btn" data-nav-link>Weather</a>
        <a href="/list" class="drawer-btn" data-nav-link>List</a>
      </div>
    </nav>

    <main>
    </main>

    <!-- TEMPLATES -->

      <div class="widgets-section">
        <weather-current clickable="true" show-city="true"></weather-current>

    <template id="local-note">
      <h1>Offline Note</h1>
      <textarea id="note"></textarea>
    </template>

    <template id="offline-list">
      <h1>Offline List</h1>
      <ul id="list"></ul>
    </template>

    <template id="weather-page">
        <div class="weather-page-content">
            <weather-controls></weather-controls>
            <weather-current show-city="true"></weather-current>
            <weather-meta></weather-meta>
            <weather-map></weather-map>
            <weather-debug></weather-debug>
        </div>
    </template>

    <template id="weather-current">
        <div class="weather-current-inner">
            <div class="no-data-message">
                <span>Click to set up weather</span>
            </div>
            <div class="error-message" style="display: none;">
                <span>Unable to load weather data</span>
            </div>
            <div class="weather-data-content" style="display: none;">
                <div class="city-name skeleton-text">--</div>
                <div class="current">
                    <div class="current-main">
                        <div class="current-temp skeleton-text">--°</div>
                        <div class="current-condition skeleton-text">Loading weather...</div>
                    </div>
                    <div class="current-stats">
                        <div class="current-stat">
                            <span class="current-stat-label">Humidity</span>
                            <span class="current-stat-value humidity skeleton-text">--%</span>
                        </div>
                        <div class="current-stat">
                            <span class="current-stat-label">Rain</span>
                            <span class="current-stat-value precipitation skeleton-text">--mm</span>
                        </div>
                        <div class="current-stat">
                            <span class="current-stat-label">Wind</span>
                            <span class="current-stat-value wind skeleton-text">--m/s</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="weather-meta">
        <div class="weather-meta-inner">
            <div class="meta-grid">
                <div class="meta-item">
                    <div class="meta-label">Latitude</div>
                    <div class="meta-value skeleton-text" data-meta="latitude">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Longitude</div>
                    <div class="meta-value skeleton-text" data-meta="longitude">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Timezone</div>
                    <div class="meta-value skeleton-text" data-meta="timezone">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Elevation</div>
                    <div class="meta-value skeleton-text" data-meta="elevation">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">UTC Offset</div>
                    <div class="meta-value skeleton-text" data-meta="utc-offset">--</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Gen Time</div>
                    <div class="meta-value skeleton-text" data-meta="gen-time">--</div>
                </div>
            </div>
        </div>
    </template>

    <template id="weather-map">
        <div class="weather-map-inner">
            <div id="map"></div>
            <div class="map-attribution" style="text-align:center;">
                <p><small>Data from <a href="https://open-meteo.com/">Open-Meteo</a> | Maps by <a href="https://leafletjs.com/">Leaflet</a></small></p>
                <p><small id="mapAttr"></small></p>
            </div>
        </div>
    </template>

    <template id="weather-debug">
        <details class="debug-data">
            <summary>Debug Data</summary>
            <pre id="data"></pre>
        </details>
    </template>

    <template id="weather-controls">
        <div class="controls">
            <input type="text" id="cityInput" placeholder="City Name, State. Saint Paul, MN">
            <button type="button" class="fetch-btn">Fetch</button>
            <button type="button" id="unitBtn">°C</button>
        </div>
        <div id="error" class="error-message"></div>
        <div id="loading" class="loading-message"></div>
    </template>

    <!-- END OF TEMPLATES -->

    <script src="scripts/nav.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
