		<template id="about-page">
			<div class="about-container">
				<section class="about-section section-divider">
					<h1>Welcome to Pockist</h1>
                    <p>This is my <s>website</s> <a target="_blank" href="https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps">progressive web app</a>.</p>
					<p>
						<a target="_blank" href="https://github.com/tannerr-dev/pockist"
						>Check out the code</a> or 
                    <a href="https://tannerr.dev" target="_blank">more about me.</a>
					</p>
                    <div class="about-caution">
                        <p><i>Alpha pre-release</i></p>
                        <p><b>Version: 0.1.25</b></p>
                        <p>This app is in active development and uses the latest browser features. Some browsers do not support these yet.</p>
                        <p>Best experienced in <a target="_blank" href="https://en.wikipedia.org/wiki/Chromium_(web_browser)">chromium</a> based browsers.</p>
                        <p>Use: Chrome, Brave, DuckDuckGo, Edge, etc.</p>
                    </div>
				</section>

				<section class="about-section section-divider">
					<div class="section-label">Privacy</div>
					<p class="about-lead">
						Your data lives on <strong>your device</strong> only.
					</p>
					<p>
						Pockist stores everything locally in your browser. No accounts, no
						tracking, no cloud unless you choose to share or export.
					</p>
				</section>

				<section class="about-section section-divider">
					<div class="section-label">Install</div>
					<p class="about-lead">Add Pockist to your home screen.</p>
					<p>
						Since this is a progressive web app, you can install it like a
						native app. On mobile, hit "Add to Home Screen" in your browser
						menu. On desktop, look for the install icon in your address bar.
					</p>
				</section>

				<section class="about-section section-divider">
					<div class="section-label">Features</div>
					<div class="about-cards">
						<div class="about-card">
							<div class="about-card-title">Notes</div>
							<p>
								Jot down ideas or quick thoughts. Everything saves automatically
								to your device.
							</p>
						</div>
						<div class="about-card">
							<div class="about-card-title">Lists</div>
							<p>
								Keep track of tasks or groceries. Tap items to check them off,
								no account needed.
							</p>
						</div>
						<div class="about-card">
							<div class="about-card-title">Weather</div>
							<p>
								Check current conditions and forecasts for any city. Uses your
								location or a quick search.
							</p>
						</div>
						<div class="about-card">
							<div class="about-card-title">Archive</div>
							<p>
								Stash old notes and lists you don't need right now but might
								want later.
							</p>
						</div>
					</div>
				</section>

				<section class="about-section section-divider">
					<div class="section-label">How to use</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Homepage</div>
						<p>
							Your homepage shows widgets for your latest notes, lists, and
							weather. Tap any note or list item to open it directly. Tap the
							gear icon in the drawer to customize which widgets appear and
							reorder them.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Navigation</div>
						<p>
							Tap the hamburger menu (top right) to open the drawer. From there
							you can jump to any page, export your data as a JSON backup, import
							a backup to restore, change the accent color with the hue slider, or
							toggle between dark and light mode.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Notes</div>
						<p>
							Tap <strong>+ New Note</strong> to create one. Just start typing in
							the editor — everything saves automatically. Use the back arrow to
							return to your notes list. The share button lets you create a
							temporary 24-hour link to share with others. Tap the three-dot menu
							to archive or delete a note.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Lists</div>
						<p>
							Tap <strong>+ New List</strong> to create a list. Type an item and
							press <strong>Enter</strong> or tap <strong>Add</strong> to add it.
							Tap the checkbox to check it off. Tap the list name at the top to
							switch between different lists. Drag items by the handle to reorder
							them. Lists also support sharing and archiving via the same buttons.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Weather</div>
						<p>
							Enter a city name (e.g., "Saint Paul, MN") and tap
							<strong>Fetch</strong> to see current conditions, stats, and a
							location map. Tap the <strong>°C</strong> button to switch between
							Celsius and Fahrenheit.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Archive</div>
						<p>
							Archived notes and lists live here. Tap any item to view it or
							restore it back to the main app.
						</p>
					</div>

					<div class="how-to-card">
						<div class="how-to-card-title">Sharing</div>
						<p>
							Tap the share button on any note or list to generate a temporary
							link. Copy the URL and send it — the recipient can view and import
							the content. Links automatically expire after 24 hours. You can
							delete a share early if you still have the original deletion token.
						</p>
					</div>
				</section>

			</div>
		</template>

		<!-- Note Index Page (/note) -->
		<template id="pockist-note-index">
			<div class="note-index-container">
				<div class="note-index-header">
					<h1>Notes</h1>
					<div class="note-index-controls">
						<select class="note-index-sort">
							<option value="updated-desc">Newest updated</option>
							<option value="created-desc">Newest created</option>
							<option value="created-asc">Oldest first</option>
							<option value="title-asc">Title A–Z</option>
						</select>
						<button
							class="note-index-new-btn btn btn-outline-secondary"
							type="button"
						>
							+ New Note
						</button>
					</div>
				</div>
				<div class="note-index-count"></div>
				<div class="note-index-items"></div>
				<div class="note-index-empty" style="display: none">
					<p>No notes yet.</p>
					<button
						class="note-index-empty-new-btn btn btn-outline-secondary"
						type="button"
					>
						Create your first note
					</button>
				</div>
			</div>
		</template>

		<!-- Note Detail Page (/note/:noteId) -->
		<template id="pockist-note-detail">
			<div class="note-detail-container">
				<div class="editor-header">
					<div class="editor-actions">
						<button
							id="back-btn"
							class="btn btn-outline btn-icon"
							type="button"
							title="Back to notes"
						>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="20"
								height="20"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path d="M19 12H5" />
								<path d="M12 19l-7-7 7-7" />
							</svg>
						</button>
						<div class="editor-actions-right">
							<share-button
								id="editor-share-btn"
								type="note"
								data-id=""
								title=""
							></share-button>
							<button
								id="editor-more-btn"
								class="btn btn-outline btn-icon"
								type="button"
								title="More actions"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="20"
									height="20"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								>
									<circle cx="12" cy="5" r="1" />
									<circle cx="12" cy="12" r="1" />
									<circle cx="12" cy="19" r="1" />
								</svg>
							</button>
						</div>
					</div>
				</div>
				<textarea
					id="note-content"
					placeholder="Start typing your note..."
				></textarea>
				<span id="save-indicator"></span>
			</div>
		</template>

		<template id="offline-list">
			<h1>Offline List</h1>
			<ul id="list"></ul>
		</template>

		<template id="weather-page">
			<div class="weather-page-content">
				<weather-controls></weather-controls>
				<weather-current show-city="true"></weather-current>
				<weather-meta></weather-meta>
				<weather-map></weather-map>
				<weather-debug></weather-debug>
			</div>
		</template>

		<template id="weather-current">
			<div class="weather-current-inner">
				<div class="weather-body">
					<div class="weather-left">
						<div class="city-name skeleton-text">--</div>
						<div class="current-condition skeleton-text">--</div>
					</div>
					<div class="weather-center">
						<div class="current-temp skeleton-text">--°</div>
					</div>
					<div class="weather-right">
						<div class="weather-stats">
							<div class="stat-item">
								<span class="stat-label">Humidity</span>
								<span class="stat-value humidity skeleton-text">--%</span>
							</div>
							<div class="stat-item">
								<span class="stat-label">Rain</span>
								<span class="stat-value precipitation skeleton-text">--mm</span>
							</div>
							<div class="stat-item">
								<span class="stat-label">Wind</span>
								<span class="stat-value wind skeleton-text">--m/s</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</template>

		<template id="weather-meta">
			<div class="weather-meta-inner">
				<div class="section-divider">
					<div class="meta-grid data-grid data-grid--2">
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">Latitude</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="latitude"
							>--</span>
						</div>
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">Longitude</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="longitude"
							>--</span>
						</div>
					</div>
				</div>
				<div class="section-divider">
					<div class="meta-grid data-grid data-grid--2">
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">Timezone</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="timezone"
							>--</span>
						</div>
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">Elevation</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="elevation"
							>--</span>
						</div>
					</div>
				</div>
				<div class="section-divider">
					<div class="meta-grid data-grid data-grid--2">
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">UTC Offset</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="utc-offset"
							>--</span>
						</div>
						<div class="meta-item data-row">
							<span class="meta-label data-row-label">Gen Time</span>
							<span
								class="meta-value data-row-value skeleton-text"
								data-meta="gen-time"
							>--</span>
						</div>
					</div>
				</div>
			</div>
		</template>

		<template id="weather-map">
			<div class="weather-map-inner">
				<div class="section-label">Location</div>
				<div id="map"></div>
				<div class="map-attribution">
					<p>
						<small>Data from <a href="https://open-meteo.com/">Open-Meteo</a> |
							Maps by <a href="https://leafletjs.com/">Leaflet</a></small>
					</p>
					<p><small id="mapAttr"></small></p>
				</div>
			</div>
		</template>

		<template id="weather-debug">
			<details class="debug-data">
				<summary>Debug Data</summary>
				<pre id="data"></pre>
			</details>
		</template>

		<template id="weather-controls">
			<div class="controls">
				<input
					type="text"
					id="cityInput"
					placeholder="City Name, State. Saint Paul, MN"
				>
				<button type="button" class="fetch-btn">Fetch</button>
				<button type="button" id="unitBtn">°C</button>
			</div>
			<div id="error" class="error-message"></div>
		</template>

		<template id="pockist-list">
			<div class="list-container">
				<div class="list-selector-row">
					<h2>
						<a href="/list" class="list-heading-link fancy-link">Lists</a>
					</h2>
					<div class="list-selector-controls">
						<button
							id="list-selector-btn"
							class="list-selector-btn"
							title="Select list"
						>
							<span class="list-selector-name">Loading...</span>
							<span class="list-selector-arrow">▼</span>
						</button>
						<div id="list-actions" class="list-actions">
							<share-button type="list"></share-button>
						</div>
					</div>
				</div>
				<div class="list-input-row">
					<input
						type="text"
						id="list-input"
						placeholder="Add a new item..."
						autocomplete="off"
					>
					<button id="add-btn" class="btn btn-outline" type="button">
						Add
					</button>
				</div>
				<div class="list-scroll-container">
					<div id="lists-container"></div>
				</div>
			</div>
		</template>

		<template id="pockist-list-widget">
			<div class="list-container list-widget">
				<div class="list-selector-row">
					<h2>
						<a href="/list" class="list-heading-link fancy-link">Lists</a>
					</h2>
					<div class="list-selector-controls">
						<button
							id="list-shortcut-btn"
							class="btn btn-icon list-shortcut-btn"
							type="button"
							title="Open list"
						>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="20"
								height="20"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<polyline points="7 17 17 7" />
								<polyline points="7 7 17 7 17 17" />
							</svg>
						</button>
						<button
							id="list-selector-btn"
							class="list-selector-btn"
							title="Select list"
						>
							<span class="list-selector-name">Loading...</span>
							<span class="list-selector-arrow">▼</span>
						</button>
						<div id="list-actions" class="list-actions">
							<share-button type="list"></share-button>
						</div>
						<button
							id="list-more-btn"
							class="btn btn-outline btn-icon list-widget-more-btn"
							type="button"
							title="More actions"
						>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="20"
								height="20"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<circle cx="12" cy="5" r="1" />
								<circle cx="12" cy="12" r="1" />
								<circle cx="12" cy="19" r="1" />
							</svg>
						</button>
					</div>
				</div>
				<form class="list-input-row" id="list-input-form">
					<input
						type="text"
						id="list-input"
						placeholder="Add a new item..."
						autocomplete="off"
					>
					<button id="add-btn" class="btn btn-outline" type="submit">
						Add
					</button>
				</form>
				<div id="lists-container" class="list-widget-slots"></div>
				<div class="list-widget-nav-container"></div>
			</div>
		</template>

		<template id="pockist-list-page">
			<h1>Lists</h1>
			<pockist-list></pockist-list>
		</template>

		<template id="pockist-list-index">
			<div class="lists-index-container">
				<div class="lists-index-header">
					<h1>Lists</h1>
					<button
						class="lists-index-new-btn btn btn-outline-secondary"
						type="button"
					>
						+ New List
					</button>
				</div>
				<div class="lists-index-grid"></div>
				<div class="lists-index-empty" style="display: none">
					<p>No lists yet.</p>
					<button
						class="lists-index-new-btn-empty btn btn-outline-secondary"
						type="button"
					>
						Create your first list
					</button>
				</div>
			</div>
		</template>

		<template id="pockist-list-detail">
			<div class="list-detail-container">
				<div class="list-detail-header">
					<button
						class="list-detail-back btn btn-outline btn-icon"
						type="button"
						title="Back"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M19 12H5" />
							<path d="M12 19l-7-7 7-7" />
						</svg>
					</button>
					<h2 class="list-detail-heading" contenteditable="true"></h2>
					<share-button
						type="list"
						class="list-detail-share-btn"
					></share-button>
					<button
						class="list-detail-more-btn btn btn-outline btn-icon"
						type="button"
						title="More actions"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<circle cx="12" cy="5" r="1" />
							<circle cx="12" cy="12" r="1" />
							<circle cx="12" cy="19" r="1" />
						</svg>
					</button>
				</div>
				<pockist-list></pockist-list>
			</div>
		</template>

		<template id="home-settings-drawer">
			<button class="settings-back" type="button">&larr; Back</button>
			<span class="drawer-section-title">Homepage Settings</span>
			<div class="settings-widgets-list"></div>
			<div class="drawer-divider"></div>
			<button class="drawer-btn drawer-btn--import" type="button">
				Reset to Defaults
			</button>
		</template>

		<template id="pockist-archive">
			<div class="archive-container">
				<h1>Archive</h1>
				<div class="archive-empty" style="display: none">
					<p>Nothing archived yet.</p>
				</div>
				<div class="archive-section archive-section--notes">
					<h2 class="archive-section-heading">Notes</h2>
					<div class="archive-list"></div>
				</div>
				<div class="archive-section archive-section--lists">
					<h2 class="archive-section-heading">Lists</h2>
					<div class="archive-list"></div>
				</div>
				<div class="archive-section archive-section--items">
					<h2 class="archive-section-heading">List Items</h2>
					<div class="archive-list"></div>
				</div>
			</div>
		</template>

		<script src="/app.js" type="module"></script>
	</body>
</html>
